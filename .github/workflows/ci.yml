name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # TestFlight uploads are manual only — see the `beta` job.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Smoke Tests
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/PT-Helper
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use latest available Xcode on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | grep iPhone | head -5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/PT-Helper

      - name: Run SmokePlan
        run: |
          xcodebuild test \
            -project COIL.xcodeproj \
            -scheme COIL \
            -testPlan SmokePlan \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -only-testing:COILTests \
            clean test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ios/PT-Helper/fastlane/test_output

  functions:
    name: Cloud Functions (build, test, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (catalog + tsc)
        run: npm run build

      - name: Unit tests (jest)
        run: npm test

      # Advisory gate: fail the build on HIGH or CRITICAL runtime (production)
      # advisories. MODERATE advisories are allowed through as documented,
      # time-bounded accepted residuals (see functions/docs/dependency-advisories.md).
      # Review that list before raising or lowering this threshold.
      - name: Security audit gate (runtime deps, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  beta:
    name: TestFlight Upload
    needs: test
    # Manual dispatch only. This job signs a real build and submits it to Apple,
    # and `changelog_from_git_commits` publishes the last 10 commit subjects
    # verbatim to testers — so it must never fire as a side effect of a merge or
    # a branch promotion. Run it deliberately from the Actions tab, after
    # checking what the changelog will say.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios/PT-Helper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/PT-Helper

      - name: Install signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Clean up
          rm certificate.p12

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Write API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p fastlane
          echo "$ASC_KEY_CONTENT" | base64 --decode > fastlane/AuthKey.p8

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bundle exec fastlane beta

      - name: Upload dSYMs to Crashlytics
        env:
          GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
        run: |
          # Find the Crashlytics upload-symbols script from SPM checkout
          UPLOAD_SCRIPT=$(find "${HOME}/Library/Developer/Xcode/DerivedData" \
            -name "upload-symbols" -path "*/FirebaseCrashlytics/*" 2>/dev/null | head -1)
          if [ -z "$UPLOAD_SCRIPT" ]; then
            echo "⚠️ upload-symbols not found in DerivedData, skipping dSYM upload"
            exit 0
          fi
          # Find dSYM files from the archive
          DSYM_DIR=$(find build -name "*.dSYM" -type d 2>/dev/null | head -1)
          if [ -z "$DSYM_DIR" ]; then
            echo "⚠️ No dSYM files found, skipping upload"
            exit 0
          fi
          echo "Uploading dSYMs from: $DSYM_DIR"
          "$UPLOAD_SCRIPT" -gsp COIL/GoogleService-Info.plist -p ios "$DSYM_DIR"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/PT-Helper/build/*.ipa
